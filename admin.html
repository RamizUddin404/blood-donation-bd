<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - BloodAid BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div id="login" class="max-w-sm mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-xl font-bold mb-4">Admin Login</h2>
        <input type="password" id="password" class="w-full p-2 border rounded mb-4" placeholder="Enter Password">
        <button onclick="checkPass()" class="w-full bg-red-600 text-white p-2 rounded">Login</button>
    </div>
    
    <div id="admin-panel" class="hidden max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">Manage Donors</h2>
        <div id="admin-donor-list" class="grid gap-4"></div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Edit Donor Profile</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-name" class="w-full p-2 border rounded mb-2" placeholder="Full Name">
            <input type="text" id="edit-phone" class="w-full p-2 border rounded mb-2" placeholder="Phone Number">
            <input type="text" id="edit-group" class="w-full p-2 border rounded mb-2" placeholder="Blood Group">
            <input type="text" id="edit-district" class="w-full p-2 border rounded mb-2" placeholder="District">
            <input type="text" id="edit-upazila" class="w-full p-2 border rounded mb-4" placeholder="Upazila/Thana">
            <div class="flex gap-2">
                <button onclick="saveEdit()" class="flex-1 bg-green-600 text-white px-4 py-2 rounded">Save Changes</button>
                <button onclick="toggleEditModal(false)" class="flex-1 bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { projectId: "blood-donation-bd-d7f6b", databaseURL: "https://blood-donation-bd-d7f6b-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Global object to store donor data safely
        let donorsData = {};

        function checkPass() { if(document.getElementById('password').value === "admin123") { document.getElementById('login').classList.add('hidden'); document.getElementById('admin-panel').classList.remove('hidden'); loadAdminDonors(); } else { alert('Wrong password'); } }
        
        function loadAdminDonors() {
            db.ref('donors').on('value', (snap) => {
                donorsData = snap.val() || {};
                const list = document.getElementById('admin-donor-list');
                list.innerHTML = '';
                for(let id in donorsData) {
                    const d = donorsData[id];
                    list.innerHTML += `<div class="bg-white p-4 flex justify-between items-center rounded shadow">
                        <span><strong>${d.name}</strong> - ${d.bloodGroup} - ${d.district}, ${d.upazila} (${d.phone})</span>
                        <div>
                            <button onclick="openEdit('${id}')" class="bg-blue-500 text-white px-3 py-1 rounded mr-2">Edit</button>
                            <button onclick="deleteDonor('${id}')" class="bg-red-500 text-white px-3 py-1 rounded">Delete</button>
                        </div>
                    </div>`;
                }
            });
        }
        
        function openEdit(id) {
            const d = donorsData[id];
            if(!d) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-name').value = d.name || '';
            document.getElementById('edit-phone').value = d.phone || '';
            document.getElementById('edit-group').value = d.bloodGroup || '';
            document.getElementById('edit-district').value = d.district || '';
            document.getElementById('edit-upazila').value = d.upazila || '';
            toggleEditModal(true);
        }
        
        function toggleEditModal(show) { document.getElementById('edit-modal').classList.toggle('hidden', !show); }
        
        function saveEdit() {
            const id = document.getElementById('edit-id').value;
            db.ref('donors/'+id).update({
                name: document.getElementById('edit-name').value,
                phone: document.getElementById('edit-phone').value,
                bloodGroup: document.getElementById('edit-group').value,
                district: document.getElementById('edit-district').value,
                upazila: document.getElementById('edit-upazila').value
            }).then(() => { toggleEditModal(false); alert('Updated Successfully!'); });
        }
        
        function deleteDonor(id) { if(confirm('Delete this donor?')) db.ref('donors/'+id).remove(); }
    </script>
</body>
</html>
